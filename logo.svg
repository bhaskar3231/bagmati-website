<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="bagmatiLogoTitle">
  <title id="bagmatiLogoTitle">Bagmati river supply logo</title>
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152d4f"/>
      <stop offset="100%" stop-color="#244976"/>
    </linearGradient>
    <linearGradient id="river" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8dcff"/>
      <stop offset="100%" stop-color="#5ea3e6"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="42" fill="url(#brand)"/>

  <!-- Flowing river: the Bagmati moving essential supplies forward -->
  <path d="M44 38c44 16 70 35 70 61 0 27-30 39-58 63" fill="none" stroke="url(#river)" stroke-width="16" stroke-linecap="round"/>
  <path d="M91 39c39 19 62 37 62 60 0 18-14 29-33 40" fill="none" stroke="#ffffff" stroke-opacity=".32" stroke-width="7" stroke-linecap="round"/>

  <!-- Three supply units carried along the river -->
  <rect x="117" y="42" width="23" height="23" rx="5" fill="#ffb34a"/>
  <rect x="139" y="69" width="23" height="23" rx="5" fill="#ffd17f"/>
  <rect x="120" y="98" width="23" height="23" rx="5" fill="#ffb34a"/>
  <path d="M128.5 42v23M150.5 69v23M131.5 98v23" stroke="#152d4f" stroke-opacity=".25" stroke-width="2"/>

  <circle cx="55" cy="153" r="5" fill="#ffb34a"/>
  <circle cx="74" cy="142" r="3" fill="#ffffff" opacity=".55"/>
</svg>
